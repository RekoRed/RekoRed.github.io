<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SL AudioLink Bridge</title>
    <style>
        body { font-family: sans-serif; max-width: 450px; margin: 50px auto; padding: 20px; background: #121212; color: #fff; }
        input { width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #222; border: 1px solid #444; color: #fff; box-sizing: border-box; }
        button { padding: 12px; background: #007acc; color: white; border: none; cursor: pointer; font-size: 16px; width: 100%; border-radius: 4px; }
        button:hover { background: #005999; }
        #startBtn { background: #28a745; display: none; margin-top: 10px; }
        #startBtn:hover { background: #218838; }
        #muteBtn { display: none; background: #d9534f; margin-top: 10px; }
        #muteBtn:hover { background: #c9302c; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .meters { display: flex; justify-content: space-between; margin-top: 15px; }
        .bar-container { width: 30%; background: #333; height: 100px; display: flex; align-items: flex-end; border-radius: 4px; overflow: hidden; }
        .bar { width: 100%; background: #007acc; height: 0%; transition: height 0.05s linear; }
        .info { font-size: 12px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>
    <h2>SL AudioLink Bridge</h2>
    
    <div class="box">
        <label>Second Life Object URL (http://...):</label>
        <input type="text" id="slUrl" placeholder="http://simXXX.agni.lindenlab.com:12345/cap/...">
        <div class="info">The tool will automatically tunnel this securely past GitHub's HTTPS restriction.</div>

        <label>Audio Stream URL:</label>
        <input type="text" id="streamUrl" placeholder="https://yourstream.com/stream">

        <button id="configBtn">Save & Load Stream</button>
    </div>

    <p id="status">Status: Enter URLs above</p>
    
    <audio id="audioElement" crossorigin="anonymous" style="display:none;"></audio>
    
    <button id="startBtn">Connect & Start Analyzing</button>
    <button id="muteBtn">Mute Speakers (Keep SL Active)</button>

    <div class="meters">
        <div style="text-align:center; width:30%;">Bass<div class="bar-container"><div id="bassBar" class="bar"></div></div></div>
        <div style="text-align:center; width:30%;">Mids<div class="bar-container"><div id="midBar" class="bar"></div></div></div>
        <div style="text-align:center; width:30%;">Highs<div class="bar-container"><div id="highBar" class="bar"></div></div></div>
    </div>

    <script>
        const slUrlInput = document.getElementById('slUrl');
        const streamUrlInput = document.getElementById('streamUrl');
        const configBtn = document.getElementById('configBtn');
        const startBtn = document.getElementById('startBtn');
        const muteBtn = document.getElementById('muteBtn');
        const statusEl = document.getElementById('status');
        const audioElement = document.getElementById('audioElement');

        const bassBar = document.getElementById('bassBar');
        const midBar = document.getElementById('midBar');
        const highBar = document.getElementById('highBar');

        let audioCtx, analyzer, masterGain, isRunning = false, isMuted = false;
        let lastSendTime = 0;

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('sl_url')) slUrlInput.value = localStorage.getItem('sl_url');
            if (localStorage.getItem('stream_url')) streamUrlInput.value = localStorage.getItem('stream_url');
        });

        configBtn.addEventListener('click', () => {
            let rawUrl = streamUrlInput.value.trim();
            let slUrl = slUrlInput.value.trim();
            if(!slUrl || !rawUrl) {
                alert("Fill out both fields!");
                return;
            }

            localStorage.setItem('sl_url', slUrl);
            localStorage.setItem('stream_url', rawUrl);
            
            audioElement.src = rawUrl;
            audioElement.load();
            
            startBtn.style.display = 'block';
            statusEl.innerText = "Status: Stream loaded. Click Connect.";
        });

        startBtn.addEventListener('click', async () => {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtx.createMediaElementSource(audioElement);
                    
                    analyzer = audioCtx.createAnalyser();
                    analyzer.fftSize = 64;
                    
                    masterGain = audioCtx.createGain();
                    
                    source.connect(analyzer);
                    analyzer.connect(masterGain);
                    masterGain.connect(audioCtx.destination);
                }

                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                await audioElement.play();
                statusEl.innerText = "Status: Live! Broadcasting frequency data to SL.";
                startBtn.style.display = 'none';
                muteBtn.style.display = 'block';

                if (!isRunning) {
                    isRunning = true;
                    analyzeLoop();
                }
            } catch (err) {
                statusEl.innerText = "Error: Check browser console or stream format compatibility.";
                console.error(err);
            }
        });

        muteBtn.addEventListener('click', () => {
            if (!masterGain) return;
            isMuted = !isMuted;
            masterGain.gain.value = isMuted ? 0 : 1;
            muteBtn.style.background = isMuted ? "#f0ad4e" : "#d9534f";
            muteBtn.innerText = isMuted ? "Unmute Speakers" : "Mute Speakers (Keep SL Active)";
        });

        function analyzeLoop() {
            requestAnimationFrame(analyzeLoop);
            if (!analyzer) return;

            const dataArray = new Uint8Array(analyzer.frequencyBinCount);
            analyzer.getByteFrequencyData(dataArray);

            let bass = dataArray[1] || 0;
            let mids = dataArray[5] || 0;
            let highs = dataArray.length > 15 ? dataArray[15] : 0;

            bassBar.style.height = (bass / 255) * 100 + '%';
            midBar.style.height = (mids / 255) * 100 + '%';
            highBar.style.height = (highs / 255) * 100 + '%';

            let now = Date.now();
            if (now - lastSendTime > 200) {
                lastSendTime = now;
                sendDataToSL(bass, mids, highs);
            }
        }

        function sendDataToSL(b, m, h) {
            const slUrl = slUrlInput.value;
            if (!slUrl) return;

            let payload = `${b},${m},${h}`;

            // Wrap the insecure SL URL through a secure CORS/SSL proxy endpoint 
            // so GitHub Pages (HTTPS) can send data to Second Life (HTTP) without Mixed Content blocks.
            const secureProxyUrl = "https://corsproxy.io/?" + encodeURIComponent(slUrl);

            fetch(secureProxyUrl, {
                method: 'POST',
                body: payload,
                mode: 'no-cors',
                cache: 'no-store'
            }).catch(err => console.log("SL post error:", err));
        }
    </script>
</body>
</html>
