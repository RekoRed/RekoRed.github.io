<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Second Life Map Viewer - Modular</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- PapaParse for local CSV processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- App Styles -->
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <div class="sidebar">
        <h3>Map Controls</h3>
        <div class="control-group">
            <label><input type="checkbox" id="toggleGrid" checked> Region Grid</label>
        </div>
        <div class="instruction">
            💡 Double-click any region to view local CSV telemetry or query live state.
        </div>
    </div>

    <div id="map"></div>

    <!-- Application Scripts -->
    <script src="region-data.js"></script>
    <script src="main.js"></script>
</body>
</html>
