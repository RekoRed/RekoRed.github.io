<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Second Life Passport</title>
    
    <!-- Modern Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: sans-serif; background: #f7f3e8; color: #5d4037; padding: 20px; }
        #map-container { width: 800px; height: 600px; border: 3px solid #5d4037; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>My Passport Map</h1>
    <div id="map-container"></div>

    <script>
        // Initialize the map with custom coordinate system
        const map = L.map('map-container', {
            crs: L.CRS.Simple,
            minZoom: 1,
            maxZoom: 8
        }).setView([1002, 997], 7);

        // Add SL Tiles
        L.tileLayer('http://map.secondlife.com/map-{z}-{x}-{y}-objects.jpg', {
            tms: true,
            minZoom: 1,
            maxZoom: 8
        }).addTo(map);

        // Your Marker (from your example)
        const marker = L.marker([1002, 997]).addTo(map);
        marker.bindPopup("<b>Welcome Area Fountain!</b><br>This is where the fountain is.");
    </script>
</body>
</html>
