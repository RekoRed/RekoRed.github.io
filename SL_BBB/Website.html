<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BBB Stamp Tracker</title>
<style>
    body { background-color: #f7f3e8; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; color: #5d4037; }
    #stamp-container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; color: #5d4037; }

    /* Dropdown Headers */
    .region-dropdown summary { font-size: 1.5em; font-weight: bold; color: #5d4037; cursor: pointer; padding: 15px; background: #eaddc5; border-radius: 10px; margin-bottom: 5px; list-style: none; transition: background 0.2s; }
    .region-dropdown summary:hover { background: #dcd0bc; }
    .region-dropdown summary::after { content: ' ▶'; font-size: 0.6em; }
    .region-dropdown[open] summary::after { content: ' ▼'; }

    /* Grid Container */
    .region-content { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 15px; padding: 40px 10px 15px 10px; max-height: 0; transition: max-height 0.4s ease-in-out, opacity 0.3s ease; opacity: 0; }
    .region-dropdown[open] .region-content { max-height: 5000px; opacity: 1; }

    /* Stamp Wrapper & Tooltip */
    .stamp-wrapper { position: relative; display: inline-block; cursor: pointer; z-index: 1; }
    .tooltip { visibility: hidden; background-color: #fff; color: #5d4037; padding: 5px 10px; border-radius: 6px; position: absolute; z-index: 9999; bottom: 120%; left: 50%; transform: translateX(-50%); white-space: nowrap; border: 1px solid #dcd0bc; box-shadow: 0 4px 8px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 0.8em; pointer-events: none; }
    .stamp-wrapper:hover .tooltip { visibility: visible; }
    .tooltip-icon { width: 16px; height: 16px; object-fit: contain; }

    /* Grid Images */
    .grid-stamp { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; border: 2px solid transparent; box-shadow: 0 3px 6px rgba(0,0,0,0.1); transition: transform 0.2s, border-color 0.2s; }
    .stamp-wrapper:hover .grid-stamp { transform: scale(1.1); border-color: #ff9f1c; }

    /* Modal Styling */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(3px); }
    .modal-content { background: #f7f3e8; padding: 30px; border-radius: 12px; max-width: 550px; width: 90%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative; animation: popIn 0.3s ease-out; }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .close-btn { position: absolute; top: 10px; right: 15px; font-size: 1.8em; cursor: pointer; color: #5d4037; }
    .close-btn:hover { color: #ff9f1c; }
    .modal-stamp-img { width: 100%; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); margin-bottom: 20px; border: 3px solid #fff; }
    .modal-info-row { display: flex; align-items: center; justify-content: center; margin-bottom: 25px; }
    .modal-icon { width: 35px; height: 35px; margin-right: 15px; object-fit: contain; }
    .modal-name { font-size: 1.3em; font-weight: bold; color: #5d4037; }
    .tp-btn { background-color: #ff9f1c; color: white; padding: 10px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 1rem; display: inline-block; }
    .tp-btn:hover { background-color: #e68a17; }
</style>
</head>
<body>

    <h1>Current BBB Stamps</h1>
    <div id="stamp-container">Loading...</div>

    <div id="stamp-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modal-img" class="modal-stamp-img" src="">
            <div class="modal-info-row">
                <img id="modal-icon" class="modal-icon" src="" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1041/1041883.png';">
                <span id="modal-name" class="modal-name">Name</span>
            </div>
            <a id="modal-tp" class="tp-btn" href="#">Teleport</a>
        </div>
    </div>

<script>
    // Point this to your local file
    const url = 'BBB_StampPage.html'; 
    
    const RESIDENT_DATABASE = ["Hollyee", "North Crannock", "Scarlett Amethyst", "Bo Juisser", "Sumire Nightfall", "Radioactive Rosca", "Gemma Cleanslate", "Lisa Figueroa", "Stormey Pixels", "Alan Standish", "Elysiane Sapphire", "Mike Mapp", "Rascal Starlight", "Fenella Allen", "Liberty Fairelander", "William Fairelander", "Boo Rojyo", "Bel Bailey", "Dave (Lord Junibalya)", "AmandaT Tamatzui", "Dreamy Fairelander", "Sandy Burgess", "Fiona Jogiches"];
    const ICON_MAP = {
        "Person (Linden)": "https://images.icon-icons.com/1508/PNG/512/secondlife-icon_104021.png",
        "Person (Mole)": "https://cdn.creazilla.com/cliparts/7771239/mole-animal-clipart-xl.png",
        "Person (Resident)": "https://symbols.getvecta.com/stencil_178/1_bust-in-silhouette.1ab4094cd9.png",
        "Kiosk": "https://cdn-icons-png.flaticon.com/512/744/744411.png"
    };

    function getCategory(name) {
        const n = name.toUpperCase();
        if (n.includes("LINDEN")) return "Person (Linden)";
        if (n.includes("MOLE")) return "Person (Mole)";
        if (RESIDENT_DATABASE.some(res => n.includes(res.toUpperCase()))) return "Person (Resident)";
        return "Kiosk";
    }

    function openModal(uuid, name, slurl, label) {
        document.getElementById('modal-img').src = `https://picture-service.secondlife.com/${uuid}/320x240.png`;
        document.getElementById('modal-icon').src = ICON_MAP[label] || ICON_MAP['Kiosk'];
        document.getElementById('modal-name').innerText = name;
        document.getElementById('modal-tp').href = slurl;
        document.getElementById('stamp-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('stamp-modal').style.display = 'none'; }

    document.getElementById('stamp-container').addEventListener('click', function(e) {
        const wrapper = e.target.closest('.stamp-wrapper');
        if (wrapper) {
            const d = wrapper.dataset;
            openModal(d.uuid, d.name, d.slurl, d.label);
        }
    });

    fetch(url)
        .then(res => res.text())
        .then(html => {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const rows = doc.querySelectorAll('tbody tr');
            const container = document.getElementById('stamp-container');
            const hierarchy = {};
            const uuidRegex = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/;

            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                if (cells.length < 2) return;
                const stampImg = cells[0].querySelector('img');
                const link = row.querySelector('a');
                const match = stampImg?.src.match(uuidRegex);
                if (match && link) {
                    const rawRegion = decodeURIComponent(link.href.split('/').slice(-4, -3)[0] || "Unknown");
                    const stampName = link.innerText.trim();
                    if (!hierarchy[rawRegion]) hierarchy[rawRegion] = [];
                    hierarchy[rawRegion].push({ name: stampName, slurl: link.href, uuid: match[0], label: getCategory(stampName) });
                }
            });

            container.innerHTML = '';
            Object.keys(hierarchy).sort().forEach(region => {
                container.innerHTML += `
                    <details class="region-dropdown" ${region.startsWith("SLB") ? "open" : ""}>
                        <summary>${region} (${hierarchy[region].length})</summary>
                        <div class="region-content">
                            ${hierarchy[region].map(data => `
                                <div class="stamp-wrapper" data-uuid="${data.uuid}" data-name="${data.name.replace(/"/g, '&quot;')}" data-slurl="${data.slurl}" data-label="${data.label}">
                                    <span class="tooltip"><img src="${ICON_MAP[data.label]}" class="tooltip-icon"> ${data.name}</span>
                                    <img src="https://picture-service.secondlife.com/${data.uuid}/320x240.png" class="grid-stamp" loading="lazy">
                                </div>
                            `).join('')}
                        </div>
                    </details>`;
            });
        });
</script>
</body>
</html>
