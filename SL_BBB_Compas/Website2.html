<!DOCTYPE html>
<html>
<head>
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { border: 1px solid #444; padding: 15px; border-radius: 10px; background: #1e1e2e; }
        img { width: 100%; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>BBB Stamp Tracker</h1>
    <div id="grid" class="grid"></div>

    <script>
        // Because 'stamps.json' is in your OWN repo, there is no CORS error!
        fetch('stamps.json')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('grid');
                data.forEach(item => {
                    grid.innerHTML += `
                        <div class="card">
                            <h3>${item.name}</h3>
                            <img src="https://picture-service.secondlife.com/${item.uuid}/320x240.png" loading="lazy">
                            <a href="${item.slurl}">Teleport</a>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
