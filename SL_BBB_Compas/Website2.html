<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, #map { height: 100vh; margin: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([1000, 1000], 2);

        // This is a community-maintained tile server 
        // It does NOT have the same security blocks as Linden Lab's CDN
        L.tileLayer('https://map.osgrid.org/map/{z}/{x}/{y}.png', {
            attribution: 'Grid Map',
            maxZoom: 10
        }).addTo(map);
    </script>
</body>
</html>
